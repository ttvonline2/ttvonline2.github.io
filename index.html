<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ủng hộ Bạch Tuộc">
    <title>Ủng hộ Bạch Tuộc</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Temporary page. The full portfolio is saved in index.backup.html -->
    <style>
        html, body { margin: 0; min-height: 100%; }
        body {
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            padding: 20px 16px 40px; box-sizing: border-box;
            background: radial-gradient(ellipse at 50% 20%, #062338 0%, #020a14 60%, #01040a 100%);
            color: #e8f8ff; font-family: system-ui, "Segoe UI", sans-serif; text-align: center;
        }
        .octopus {
            width: min(360px, 100%); aspect-ratio: 9 / 16; border: 0; border-radius: 22px; display: block;
            background: #04182a;
        }
        h1 { margin: 0; font-size: clamp(20px, 5vw, 28px); font-weight: 700; }
        .qr {
            width: min(320px, 100%); height: auto; border-radius: 16px; background: #fff; padding: 10px; box-sizing: border-box;
            box-shadow: 0 12px 50px rgba(0, 150, 230, .25);
        }
        .card {
            width: min(360px, 100%); box-sizing: border-box; padding: 20px 16px; border-radius: 18px;
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            background: rgba(10, 60, 100, .25); border: 1px solid rgba(120, 200, 255, .2);
        }
        .card p { margin: 0; font-size: 17px; line-height: 1.5; }
        .discord {
            display: inline-block; padding: 12px 22px; border-radius: 12px;
            background: #5865f2; color: #fff; font-weight: 700; text-decoration: none;
        }
        .discord:hover { background: #4752c4; }
    </style>
</head>
<body>
    <iframe class="octopus" src="octopus/octopus.html" title="Bạch Tuộc demo"></iframe>
    <h1>Ủng hộ Bạch Tuộc với QR bên dưới nhé</h1>
    <img class="qr" src="images/donate-qr.jpg" alt="Mã QR ủng hộ Bạch Tuộc">
    <div class="card">
        <p>Anh em tham gia cộng đồng tools của mình</p>
        <a class="discord" href="https://discord.gg/XCXxS7e7H" target="_blank" rel="noopener noreferrer">Tham gia Discord</a>
    </div>
    <div class="card">
        <p>Anh em cần làm tools, phần mềm hỗ trợ công việc thì liên hệ mình qua Zalo</p>
        <img class="qr" src="images/zalo-qr.jpg" alt="Mã QR Zalo liên hệ">
    </div>
</body>
</html>
